services:
  db:
    image: postgres:15
    container_name: practica3_postgres
    environment:
      POSTGRES_DB: practica3_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practica3_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: practica3_django
    environment:
      POSTGRES_DB: practica3_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: